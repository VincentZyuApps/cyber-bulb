name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check publish trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_publish: ${{ steps.flags.outputs.should_publish }}
    steps:
      - name: Parse commit message
        id: flags
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re

          event_name = os.environ["EVENT_NAME"]
          message = os.environ.get("COMMIT_MESSAGE", "")
          matched = re.search(r"\[publish-?pypi\]", message, re.IGNORECASE) is not None
          should_publish = event_name == "push" and matched
          should_build = event_name == "pull_request" or should_publish

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_build={str(should_build).lower()}\n")
              output.write(f"should_publish={str(should_publish).lower()}\n")

          print(f"build={should_build} publish={should_publish}")
          PY

  compatibility:
    name: Python ${{ matrix.python-version }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync project
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Test package and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --locked --python "${{ matrix.python-version }}" python - <<'PY'
          from PyQt5.QtWidgets import QApplication
          from cyber_bulb import DigitalClock

          app = QApplication([])
          clock = DigitalClock()
          assert clock.windowTitle() == "数字时钟 - 晶体管显示"
          assert clock.is_dark_mode is False
          clock.toggle_mode()
          assert clock.is_dark_mode is True
          clock.close()
          app.quit()
          PY

  build:
    name: Build distributions
    needs: [check, compatibility]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.should_publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cyber-bulb
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
